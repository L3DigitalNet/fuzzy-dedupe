[package]
name = "fuzzy-dedupe-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fuzzy-dedupe-domain = { path = "../fuzzy-dedupe-domain" }
fuzzy-dedupe-storage = { path = "../fuzzy-dedupe-storage" }
fuzzy-dedupe-scanner = { path = "../fuzzy-dedupe-scanner" }
fuzzy-dedupe-analyzers = { path = "../fuzzy-dedupe-analyzers" }
fuzzy-dedupe-fileops = { path = "../fuzzy-dedupe-fileops" }

# Every third-party crate here needs its spec §8.3 row and its
# .github/boundaries.toml [third-party] entry (plan §3.4, MS-0 C-7), and adding
# one is a D-014 change: a minimal lock update and a reviewed lock diff.
#
# Bounded request and event queues of the C-02 facade (plan D-008).
crossbeam-channel = "=0.5.17"
# Line differences for Compare; first used by the comparison service (T6).
# The default `text` feature is the line-diff API; it adds no crate.
similar = "=3.2.1"
# Unicode NFC for the comparison service's Normalized view (T6).
unicode-normalization = "=0.1.26"

[dev-dependencies]
# Normalization property tests for the comparison service (T6). Without the
# default features, which add the fork and timeout runners and their
# process-spawning dependencies; `std` alone runs properties in-process.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true

# Rust gates of spec §17.2 (plan Appendix A C-3). The job IDs are a contract:
# required checks and later milestones refer to them, so renaming one is a
# contract change, not a cleanup.
#
# Supply chain (plan D-004): the actions are actions/checkout, pinned to the
# commit admission.yml uses, and, in `ui-test` only, actions/upload-artifact
# (MS-1 plan T22), both first-party and pinned by commit SHA. The toolchain
# comes from rust-toolchain.toml
# through the runner's preinstalled rustup. Rejected: dtolnay/rust-toolchain,
# taiki-e/install-action and cache actions, which are third-party
# dependencies the owner has not agreed to. nextest, cargo-deny and
# cargo-audit are the exact release assets that .rexec.toml pins, verified
# against the same SHA-256 digests. Bump a tool in .rexec.toml and here in the
# same change, or CI and the rexec worker run different gate versions.

name: Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; a `main` run always completes,
  # because it is the record that the landed commit passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Installs the channel and components that rust-toolchain.toml pins, as
      # its own step so download time and failures are not attributed to
      # the gate.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Asset and digest equal the .rexec.toml `github:nextest-rs/nextest`
      # pin. `sha256sum -c` exits nonzero on a mismatch, which fails the step
      # before the archive is unpacked.
      - name: Install cargo-nextest
        run: |
          asset=cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/$asset"
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --workspace --locked
      # No --no-tests=warn: a run that finds no tests exits 4 and fails the
      # job, so losing the test suite cannot pass silently.
      - name: Run tests
        run: cargo nextest run --workspace --locked
      # PV-T31-001 exhaustive tier: the review-policy enumeration at the
      # plan's bound needs a release build, so its tests are #[ignore]d in
      # the debug run above and run only here. A filter that matches no test
      # exits 4 and fails the step, so renaming the module cannot pass
      # silently.
      - name: Run the review-policy enumeration (release)
        run: cargo nextest run -p fuzzy-dedupe-engine --release --locked --run-ignored only -E 'test(review_policy::enumeration)'
      # nextest does not run documentation tests, so they run separately.
      - name: Run documentation tests
        run: cargo test --doc --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Asset and digest equal the .rexec.toml `github:EmbarkStudios/cargo-deny`
      # pin.
      - name: Install cargo-deny
        run: |
          asset=cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/$asset"
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # `--locked` is a cargo-deny global option, so it precedes `check`.
      - name: Check dependency policy
        run: cargo deny --locked check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Asset and digest equal the .rexec.toml `github:rustsec/rustsec` pin.
      - name: Install cargo-audit
        run: |
          asset=cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/$asset"
          echo "b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # cargo-audit reads Cargo.lock as committed and has no `--locked` flag.
      - name: Audit dependencies
        run: cargo audit

  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Runs after the toolchain install so the targets attach to the pinned
      # channel, not the runner's default one. The targets are deliberately
      # absent from rust-toolchain.toml (plan D-005), which would add two
      # standard-library downloads to every workstation and worker install.
      - name: Add the portability targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - name: Check for Windows
        run: cargo check --locked -p fuzzy-dedupe-domain -p fuzzy-dedupe-platform --target x86_64-pc-windows-msvc
      - name: Check for macOS
        run: cargo check --locked -p fuzzy-dedupe-domain -p fuzzy-dedupe-platform --target aarch64-apple-darwin

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Reads .github/boundaries.toml by default (plan D-011, Appendix A C-7);
      # this is the same invocation as the local proof.
      - name: Check crate boundaries
        run: python3 .github/scripts/check-boundaries.py

  # PV-T22-002 (MS-1 plan T22, D-007; spec §17.2): egui_kittest snapshots of
  # the 16 review states in both themes, 32 tests, from
  # crates/fuzzy-dedupe-app/tests/snapshots.rs. The only job that needs a GPU
  # adapter: the `snapshot` feature that builds those tests is enabled here
  # and nowhere else. Baselines are valid only from this job's pinned image
  # and its Mesa lavapipe, so the image is a named release, not
  # ubuntu-latest, and an image or Mesa change means regenerating the
  # baselines in a reviewed PR. The baseline procedure is in the header of
  # tests/snapshots.rs.
  ui-test:
    runs-on: ubuntu-24.04
    env:
      # Vulkan only, so wgpu cannot fall back to a GL adapter whose
      # rendering the baselines were not made with.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # mesa-vulkan-drivers carries lavapipe, the CPU Vulkan device that
      # egui_kittest's adapter choice prefers; libvulkan1 is the loader.
      - name: Install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
      # The record EV-006 cites (plan T22.1, T22.6): the image, the Mesa
      # packages and the Vulkan devices the baselines target.
      - name: Record the runner image, Mesa version and adapter
        run: |
          echo "image: $ImageOS $ImageVersion"
          dpkg-query --show --showformat='${Package} ${Version}\n' \
            mesa-vulkan-drivers libvulkan1
          vulkaninfo --summary
      # Same asset and digest as the `test` job and the .rexec.toml pin.
      - name: Install cargo-nextest
        run: |
          asset=cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/$asset"
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The `clippy` job builds without the feature, so this is the only lint
      # of tests/snapshots.rs.
      - name: Run Clippy on the snapshot tests
        run: cargo clippy -p fuzzy-dedupe-app --features snapshot --tests --locked -- -D warnings
      # 16 review states x 2 themes (plan Appendix A C-11). Counted by name
      # before the run, so a lost or doubled frame fails here rather than
      # passing with fewer snapshots.
      - name: Count the snapshot tests
        run: |
          count=$(cargo nextest list -p fuzzy-dedupe-app --features snapshot --locked \
            -E 'binary(snapshots) & test(/::(light|dark)$/)' --message-format oneline | wc -l)
          echo "snapshot tests: $count"
          test "$count" -eq 32
      # --no-tests=fail: a run that selects no test fails the job.
      # --no-fail-fast: every frame runs even after one fails, so the
      # uploaded artifact holds a new image for each missing or changed
      # baseline instead of only the first few nextest reached.
      - name: Run the snapshot tests
        run: cargo nextest run -p fuzzy-dedupe-app --features snapshot --locked --no-tests=fail --no-fail-fast -E 'binary(snapshots)'
      # A missing or differing baseline leaves <name>.new.png (and, for a
      # difference, <name>.diff.png) beside it; they are the candidate
      # baselines and the evidence of what moved.
      - name: Upload new and diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: |
            crates/fuzzy-dedupe-app/tests/snapshots/*.new.png
            crates/fuzzy-dedupe-app/tests/snapshots/*.diff.png
          if-no-files-found: warn

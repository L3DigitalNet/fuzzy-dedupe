name: GitHub Workflow admission

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check commit admission
        run: .agents/skills/github-workflow/bin/gh-workflow admission --branch main --offline
